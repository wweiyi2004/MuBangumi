name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "packages/banjian_server/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "shorebird.yaml"
      - "android/**"
      - "ios/**"
      - "windows/**"
      - "tool/build_release.ps1"
      - "tool/*windows*package*.ps1"
      - "tool/package_windows_release.ps1"
      - "tool/tests/windows_package_safety_test.ps1"
      - "tool/tests/release_build_test.ps1"
      - "tool/verify_repository_privacy.ps1"
      - ".gitignore"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "packages/banjian_server/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "shorebird.yaml"
      - "android/**"
      - "ios/**"
      - "windows/**"
      - "tool/build_release.ps1"
      - "tool/*windows*package*.ps1"
      - "tool/package_windows_release.ps1"
      - "tool/tests/windows_package_safety_test.ps1"
      - "tool/tests/release_build_test.ps1"
      - "tool/verify_repository_privacy.ps1"
      - ".gitignore"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Install Banjian server dependencies
        working-directory: packages/banjian_server
        run: dart pub get

      - name: Analyze Banjian server
        working-directory: packages/banjian_server
        run: dart analyze

      - name: Test Banjian server
        working-directory: packages/banjian_server
        run: dart test

      - name: Verify Windows packaging safeguards
        run: ./tool/tests/windows_package_safety_test.ps1

      - name: Verify release build artifacts and symbols
        run: ./tool/tests/release_build_test.ps1
