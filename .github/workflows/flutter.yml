name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "shorebird.yaml"
      - "android/**"
      - "ios/**"
      - "windows/**"
      - "tool/build_release.ps1"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "shorebird.yaml"
      - "android/**"
      - "ios/**"
      - "windows/**"
      - "tool/build_release.ps1"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
