name: Python tool checks
on:
  push:
    branches: [main]
    paths: ['tool/recommend_dataset/**', 'tool/semantic_retrieval/**', 'tool/mirror_release.py', 'tool/requirements-mirror.*', 'tool/tests/mirror_release_test.py', 'tool/toolchain.json', '.github/workflows/python.yml']
  pull_request:
    paths: ['tool/recommend_dataset/**', 'tool/semantic_retrieval/**', 'tool/mirror_release.py', 'tool/requirements-mirror.*', 'tool/tests/mirror_release_test.py', 'tool/toolchain.json', '.github/workflows/python.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {project: recommend_dataset, requirements: tool/recommend_dataset/requirements.txt, command: 'python -m pytest tool/recommend_dataset/tests -q'}
          - {project: semantic_retrieval, requirements: tool/semantic_retrieval/requirements.txt, command: 'python -m pytest tool/semantic_retrieval/tests -q'}
          - {project: release_mirror, requirements: tool/requirements-mirror.txt, command: 'python -m unittest discover -s tool/tests -p mirror_release_test.py'}
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        shell: pwsh
        run: |
          $v = Get-Content tool/toolchain.json -Raw | ConvertFrom-Json
          "python=$($v.python.'${{ matrix.project }}')" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - run: python -m pip install --require-hashes -r ${{ matrix.requirements }}
      - run: python -m pip check
      - run: ${{ matrix.command }}
