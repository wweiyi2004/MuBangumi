name: Repository privacy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tracked-files:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No path filter: an env-only change must still run this check.
      - name: Reject tracked private configuration and runtime data
        run: ./tool/verify_repository_privacy.ps1
