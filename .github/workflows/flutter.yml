name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "packages/banjian_server/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".fvmrc"
      - "integration_test/**"
      - "tool/toolchain*"
      - "tool/check_toolchain.py"
      - "tool/verify_all.ps1"
      - "tool/release_provenance.py"
      - "tool/tests/release_provenance_test.py"
      - "shorebird.yaml"
      - "android/**"
      - "ios/**"
      - "windows/**"
      - "tool/build_release.ps1"
      - "tool/verify_architecture.py"
      - "tool/*windows*package*.ps1"
      - "tool/package_windows_release.ps1"
      - "tool/tests/windows_package_safety_test.ps1"
      - "tool/tests/release_build_test.ps1"
      - "tool/mirror_release.py"
      - "tool/requirements-mirror.txt"
      - "tool/tests/mirror_release_test.py"
      - ".github/workflows/gitee-mirror.yml"
      - "tool/verify_repository_privacy.ps1"
      - ".gitignore"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "packages/banjian_server/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".fvmrc"
      - "integration_test/**"
      - "tool/toolchain*"
      - "tool/check_toolchain.py"
      - "tool/verify_all.ps1"
      - "tool/release_provenance.py"
      - "tool/tests/release_provenance_test.py"
      - "shorebird.yaml"
      - "android/**"
      - "ios/**"
      - "windows/**"
      - "tool/build_release.ps1"
      - "tool/verify_architecture.py"
      - "tool/*windows*package*.ps1"
      - "tool/package_windows_release.ps1"
      - "tool/tests/windows_package_safety_test.ps1"
      - "tool/tests/release_build_test.ps1"
      - "tool/mirror_release.py"
      - "tool/requirements-mirror.txt"
      - "tool/tests/mirror_release_test.py"
      - ".github/workflows/gitee-mirror.yml"
      - "tool/verify_repository_privacy.ps1"
      - ".gitignore"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read toolchain
        id: toolchain
        shell: pwsh
        run: |
          $v = Get-Content tool/toolchain.json -Raw | ConvertFrom-Json
          "flutter=$($v.flutter)" >> $env:GITHUB_OUTPUT
          "python=$($v.python.release_mirror)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: website/.node-version

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.toolchain.outputs.flutter }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Root analysis also visits the standalone package's tests. Resolve its
      # dev dependencies before analysis on clean runners.
      - name: Install Banjian server dependencies
        working-directory: packages/banjian_server
        run: dart pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Verify architectural boundaries
        run: python tool/verify_architecture.py --self-test

      - name: Test
        run: flutter test

      - name: Analyze Banjian server
        working-directory: packages/banjian_server
        run: dart analyze

      - name: Test Banjian server
        working-directory: packages/banjian_server
        run: dart test

      - name: Verify browser protocol fixtures
        run: node packages/banjian_server/test/room_protocol_test.cjs

      - name: Verify Windows packaging safeguards
        run: ./tool/tests/windows_package_safety_test.ps1

      - name: Verify release build artifacts and symbols
        run: ./tool/tests/release_build_test.ps1

      - name: Verify mirror publication safeguards
        run: |
          python -m pip install --require-hashes -r tool/requirements-mirror.txt
          python -m unittest discover -s tool/tests -p mirror_release_test.py

      - name: Verify maintenance tooling
        run: |
          python tool/check_toolchain.py
          python -m unittest discover -s tool/tests -p release_provenance_test.py
          python -m unittest discover -s tool/tests -p repository_privacy_test.py
          ./tool/tests/workspace_cleanup_test.ps1
